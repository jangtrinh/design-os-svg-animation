  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">

    <linearGradient id="red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />

    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

    </div>

    <!-- Controls Bar -->

      <div class="timeline-container">
        <div class="scrubber-track" id="scrubber">

          <div class="scene-marker" style="left: 18.18%;" data-label="S2: PIPELINE (4s)"></div>
          <div class="scene-marker" style="left: 45.45%;" data-label="S3: SUPERPOWERS (10s)"></div>
          <div class="scene-marker" style="left: 81.81%;" data-label="S4: REVEAL (18s)"></div>

          <div class="scrubber-progress" id="progress"></div>
          <div class="scrubber-handle" id="handle"></div>
        </div>
      </div>

      <!-- Action Buttons & Metadata -->

          </button>
          <button class="btn" id="btn-restart">↺ Replay</button>

          <!-- Scene Quick Jumps -->
          <button class="btn btn-scene" data-time="0">Scene 1</button>
          <button class="btn btn-scene" data-time="4000">Scene 2</button>
          <button class="btn btn-scene" data-time="10000">Scene 3</button>
          <button class="btn btn-scene" data-time="18000">Scene 4</button>
        </div>

        <div class="meta-hud">
          <div class="timecode-display">
            <span class="current" id="tc-current">00:00:000</span> / <span id="tc-total">00:22:000</span>
          </div>
          <div class="badge-live">VIRTUAL CLOCK (HYPERFRAMES)</div>
        </div>
      </div>

  <script src="promo-engine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const svgElem = document.querySelector('.video-viewport svg');
      const engine = new PromoTimelineEngine(svgElem);

      const btnPlay = document.getElementById('btn-play');
      const btnRestart = document.getElementById('btn-restart');
      const playIcon = document.getElementById('play-icon');
      const playText = document.getElementById('play-text');
      const progressEl = document.getElementById('progress');
      const handleEl = document.getElementById('handle');
      const scrubberEl = document.getElementById('scrubber');
      const tcCurrent = document.getElementById('tc-current');

      function formatTime(ms) {
        const totalSec = Math.floor(ms / 1000);
        const mins = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const secs = String(totalSec % 60).padStart(2, '0');
        const millis = String(Math.floor(ms % 1000)).padStart(3, '0');
        return mins + ':' + secs + '.' + millis;
      }

      engine.on('update', (timeMs) => {
        const pct = (timeMs / engine.durationMs) * 100;
        progressEl.style.width = pct + '%';
        handleEl.style.left = pct + '%';
        tcCurrent.textContent = formatTime(timeMs);

        if (engine.isPlaying) {
          playIcon.textContent = '❚❚';
          playText.textContent = 'Pause';
        } else {
          playIcon.textContent = '▶';
          playText.textContent = 'Play';
        }
      });

      engine.on('ended', () => {
        playIcon.textContent = '▶';
        playText.textContent = 'Play';
      });

      btnPlay.addEventListener('click', () => engine.togglePlay());
      btnRestart.addEventListener('click', () => {
        engine.seek(0);
        engine.play();
      });

      // Quick Scene Buttons
      document.querySelectorAll('.btn-scene').forEach(btn => {
        btn.addEventListener('click', () => {
          const t = parseInt(btn.getAttribute('data-time'), 10);
          engine.seek(t);
        });
      });

      // Scrubber Interaction
      let isDragging = false;
      function handleScrub(e) {
        const rect = scrubberEl.getBoundingClientRect();
        const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        engine.seek(pos * engine.durationMs);
      }

      scrubberEl.addEventListener('mousedown', (e) => {
        isDragging = true;
        handleScrub(e);
      });
      window.addEventListener('mousemove', (e) => {
        if (isDragging) handleScrub(e);
      });
      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // Keyboard Shortcuts: Space = toggle play, Arrows = scrub 500ms
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          engine.togglePlay();
        } else if (e.code === 'ArrowRight') {
          engine.seek(engine.currentTimeMs + 500);
        } else if (e.code === 'ArrowLeft') {
          engine.seek(engine.currentTimeMs - 500);
        }
      });

      // Initial Render at 0ms
      engine.seek(0);
    });
  </script>
</body>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astra for Law — HyperFrames beat draft</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:40px 24px;background:#0c0d10;color:#f7f7f7;font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:930px;margin:auto}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}
    h1{margin:0;font-size:28px;letter-spacing:-.035em;line-height:1.1}
    header p{margin:8px 0 0;color:#a1a1aa;font-size:13px}
    header a{color:#e4e4e7;font-size:13px;text-decoration:none}
    .panel{border:1px solid #ffffff18;border-radius:18px;padding:20px;background:#17181d;box-shadow:0 1px 2px #0006,0 8px 22px -8px #0008,0 30px 70px -20px #0009}
    .stage-shell{width:min(100%,640px);aspect-ratio:16/9;margin:0 auto;overflow:hidden;border:1px solid #ffffff24;border-radius:12px;background:#fff}
    #hyperframe-stage{position:relative;width:640px;height:360px;transform-origin:top left}
    .controls{display:flex;align-items:center;gap:14px;margin-top:20px}
    button{border:1px solid #ffffff2a;border-radius:10px;padding:9px 17px;background:#292b32;color:#fff;font:inherit;cursor:pointer}
    button:focus-visible,input:focus-visible{outline:2px solid #d5b9eb;outline-offset:3px}
    input{flex:1;accent-color:#d5b9eb}
    output{min-width:95px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:#d4d4d8}
    #beat-name{margin-top:15px;color:#a1a1aa;font-size:13px}
  </style>
  <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
  <main>
    <header><div><h1>HyperFrames beat draft</h1><p>23 source-timed scenes · monochrome staging · 77.594 s</p></div><a href="astra-law-promo.html">Final player</a></header>
    <div class="panel">
      <div class="stage-shell" id="stage-shell"><div id="hyperframe-stage" role="img" aria-label="Monochrome HyperFrames beat draft"></div></div>
      <div class="controls"><button id="play-button" type="button">Play</button><input id="scrubber" type="range" min="0" max="77.594" step="0.001" value="0" aria-label="Scrub beat draft"><output id="timecode">00:00.0</output></div>
      <div id="beat-name">OpenAI for Law</div>
    </div>
  </main>
  <script type="module">
    import { ASTRA_HYPERFRAME_STORYBOARD, ASTRA_HYPERFRAME_DURATION, buildAstraHyperFrameDraft } from './astra-law-hyperframes-beats.mjs';
    const stage = document.getElementById('hyperframe-stage');
    const shell = document.getElementById('stage-shell');
    const scrubber = document.getElementById('scrubber');
    const playButton = document.getElementById('play-button');
    const timeline = buildAstraHyperFrameDraft(stage);
    let currentTime = 0;
    let playing = false;
    let lastTick = null;
    function resize() { stage.style.transform = `scale(${shell.clientWidth / 640})`; }
    window.__seekToTime = time => {
      currentTime = Math.max(0, Math.min(ASTRA_HYPERFRAME_DURATION, Number(time) || 0));
      const active = [...ASTRA_HYPERFRAME_STORYBOARD].reverse().find(beat => beat.start <= currentTime) || ASTRA_HYPERFRAME_STORYBOARD[0];
      const pose = matchMedia('(prefers-reduced-motion: reduce)').matches ? Math.min(active.end - 0.001, ASTRA_HYPERFRAME_DURATION) : currentTime;
      timeline.time(pose, false);
      scrubber.value = String(currentTime);
      document.getElementById('timecode').textContent = `${String(Math.floor(currentTime / 60)).padStart(2, '0')}:${(currentTime % 60).toFixed(1).padStart(4, '0')}`;
      document.getElementById('beat-name').textContent = `${active.kind} · ${active.id}`;
      return currentTime;
    };
    function tick(timestamp) {
      if (!playing) return;
      if (lastTick !== null) window.__seekToTime(currentTime + (timestamp - lastTick) / 1000);
      lastTick = timestamp;
      if (currentTime >= ASTRA_HYPERFRAME_DURATION) { playing = false; playButton.textContent = 'Play'; return; }
      requestAnimationFrame(tick);
    }
    playButton.addEventListener('click', () => {
      playing = !playing; lastTick = null; playButton.textContent = playing ? 'Pause' : 'Play';
      if (playing) { if (currentTime >= ASTRA_HYPERFRAME_DURATION) window.__seekToTime(0); requestAnimationFrame(tick); }
    });
    scrubber.addEventListener('input', () => { playing = false; playButton.textContent = 'Play'; window.__seekToTime(scrubber.value); });
    addEventListener('resize', resize);
    resize();
    window.__seekToTime(Number(new URLSearchParams(location.search).get('t') || 0));
    window.__hyperFramesDraft = { timeline, storyboard: ASTRA_HYPERFRAME_STORYBOARD };
    window.__readyPromise = Promise.resolve(true);
  </script>
</body>
</html>

  <script src="saas-short-engine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const svg = document.getElementById('saas-short-svg');
      const engine = new SaasShortEngine(svg);
      window.__saasEngine = engine;
      window.__seekToTime = (sec) => engine.seek(sec * 1000);

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('clean') === 'true' || urlParams.get('render') === 'true') {
        document.documentElement.classList.add('clean-export');
        document.body.classList.add('clean-export');
      }
      const initialSec = parseFloat(urlParams.get('t') || '0');
      const shouldAutoplay = urlParams.get('autoplay') === 'true';

      const btnPlayPause = document.getElementById('btn-play-pause');
      const btnRestart = document.getElementById('btn-restart');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const playIcon = document.getElementById('play-icon');
      const scrubber = document.getElementById('video-scrubber');
      const tcCurrent = document.getElementById('tc-current');
      const sceneNameEl = document.getElementById('scene-name');
      const sceneBtns = document.querySelectorAll('.studio-scene-pill');
      const speedBtns = document.querySelectorAll('.studio-speed-btn');

      const sceneNames = [
        { time: 0, name: "Scene 1: Model Dropdown" },
        { time: 1500, name: "Scene 2: Input Bar Expansion" },
        { time: 3500, name: "Scene 3: Kinetic Typo & Waves" },
        { time: 5500, name: "Scene 4: Dynamic Card Stack" },
        { time: 7500, name: "Scene 5: GenAI Document Streaming" },
        { time: 10000, name: "Scene 6: OpenAI Rosette & CTA" }
      ];

      function formatTime(ms) {
        const totalSec = ms / 1000;
        const mins = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const secs = (totalSec % 60).toFixed(1).padStart(4, '0');
        return mins + ':' + secs;
      }

      function updateActiveScene(t) {
        let currentScene = sceneNames[0];
        for (let i = sceneNames.length - 1; i >= 0; i--) {
          if (t >= sceneNames[i].time) {
            currentScene = sceneNames[i];
            break;
          }
        }
        if (sceneNameEl) sceneNameEl.textContent = currentScene.name;
        sceneBtns.forEach(btn => {
          const time = parseInt(btn.getAttribute('data-time'), 10);
          btn.classList.toggle('active', time === currentScene.time);
        });
      }

      engine.on('update', (t) => {
        scrubber.value = (t / 1000).toFixed(2);
        tcCurrent.textContent = formatTime(t);

        if (engine.isPlaying) {
          playIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
        } else {
          playIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
        }

        updateActiveScene(t);
      });

      engine.on('ended', () => {
        playIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      });

      btnPlayPause.addEventListener('click', () => engine.togglePlay());
      btnRestart.addEventListener('click', () => {
        engine.seek(0);
      });

      if (btnFullscreen) {
        btnFullscreen.addEventListener('click', () => {
          const frame = document.getElementById('video-stage-frame') || document.documentElement;
          if (!document.fullscreenElement) {
            frame.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });
      }

      sceneBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const t = parseInt(btn.getAttribute('data-time'), 10);
          engine.seek(t);
        });
      });

      scrubber.addEventListener('input', (e) => {
        const sec = parseFloat(e.target.value);
        engine.seek(sec * 1000);
      });

      speedBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          speedBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const speed = parseFloat(btn.getAttribute('data-speed')) || 1;
          engine.playbackRate = speed;
        });
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          engine.togglePlay();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          engine.seek(engine.currentTimeMs + (e.shiftKey ? 2000 : 250));
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          engine.seek(engine.currentTimeMs - (e.shiftKey ? 2000 : 250));
        } else if (e.code === 'Home' || e.key === '0') {
          e.preventDefault();
          engine.seek(0);
        } else if (e.code === 'KeyF') {
          e.preventDefault();
          const frame = document.getElementById('video-stage-frame') || document.documentElement;
          if (!document.fullscreenElement) frame.requestFullscreen().catch(() => {});
          else document.exitFullscreen().catch(() => {});
        }
      });

      // Initial seek
      engine.seek(initialSec * 1000);
      if (shouldAutoplay) {
        engine.play();
      }
    });
  </script>

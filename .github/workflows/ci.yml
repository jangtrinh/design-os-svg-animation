name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Anti-Flop Gates
        run: python3 scripts/anti-flop-gate.py

      - name: Test Motion IR and HyperFrames
        run: npm test

      - name: Compile TypeScript
        run: npm run build

      - name: Verify Astra Pages mirror
        run: npm run verify:astra-pages

      - name: Verify drone 404 Pages mirror
        run: node scripts/sync-line-art-pages.mjs --case drone-404 --check

      - name: Verify startup-error 404 Pages mirror
        run: node scripts/sync-line-art-pages.mjs --case startup-error-404 --check

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Anti-Flop Gates
        run: python3 scripts/anti-flop-gate.py

      - name: Test Motion IR and HyperFrames
        run: npm test

      - name: Compile TypeScript
        run: npm run build

      - name: Verify Astra Pages mirror
        run: npm run verify:astra-pages

      - name: Verify drone 404 Pages mirror
        run: node scripts/sync-line-art-pages.mjs --case drone-404 --check

      - name: Verify startup-error 404 Pages mirror
        run: node scripts/sync-line-art-pages.mjs --case startup-error-404 --check

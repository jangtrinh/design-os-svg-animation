<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design OS — Motion IR Animation Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .svg-container {
      width: 120px;
      height: 120px;
      margin: 24px 0;
    }
    .badge {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
    }
    h1 {
      margin: 12px 0 4px 0;
      font-size: 20px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 0 0 16px 0;
    }
  </style>
  <style>
/* Generated by Design OS Motion IR Compiler v1.0.0 */
/* Animation: notification-bell-ring */

.motion-canvas {
  display: inline-block;
  width: 100%;
  height: auto;
}

@keyframes anim-notification-bell-ring-t0-p0 {
  0% {
    transform: rotate(0deg);
  }
  20% {
    transform: rotate(14deg);
  }
  40% {
    transform: rotate(-12deg);
  }
  60% {
    transform: rotate(8deg);
  }
  80% {
    transform: rotate(-3deg);
  }
  100% {
    transform: rotate(0deg);
  }
}

#bell-body {
  transform-box: fill-box;
  transform-origin: 24px 8px;
  animation: anim-notification-bell-ring-t0-p0 800ms cubic-bezier(0.34, 1.56, 0.64, 1) 0ms infinite normal both;
  will-change: transform;
}

@keyframes anim-notification-bell-ring-t1-p0 {
  0% {
    transform: translate3d(0px, 0px, 0);
  }
  25% {
    transform: translate3d(-4px, 0px, 0);
  }
  50% {
    transform: translate3d(4px, 0px, 0);
  }
  75% {
    transform: translate3d(-2px, 0px, 0);
  }
  100% {
    transform: translate3d(0px, 0px, 0);
  }
}

#bell-clapper {
  transform-box: fill-box;
  transform-origin: 24px 38px;
  animation: anim-notification-bell-ring-t1-p0 750ms cubic-bezier(0.34, 1.56, 0.64, 1) 50ms infinite normal both;
  will-change: transform;
}

/* Accessibility Gate: Reduced Motion Fallback */
@media (prefers-reduced-motion: reduce) {
  #bell-body {
    animation: none !important;
    transition: opacity 200ms ease !important;
  }
  #bell-clapper {
    animation: none !important;
    transition: opacity 200ms ease !important;
  }
}

  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Motion IR Compiled</span>
    <h1>Notification Bell Ring</h1>
    <p>Hardware-accelerated CSS Keyframes with Spring Easing</p>
    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Animated Notification Bell">
  <title>Notification Bell</title>
  <!-- Bell Body -->
  <path id="bell-body" fill="#F59E0B" d="M24 6c-6.627 0-12 5.373-12 12v8l-4 6h32l-4-6v-8c0-6.627-5.373-12-12-12zm-3-3h6v3h-6z"/>
  <!-- Bell Clapper -->
  <circle id="bell-clapper" cx="24" cy="38" r="4" fill="#D97706"/>
</svg>

    </div>
  </div>
</body>
</html>
